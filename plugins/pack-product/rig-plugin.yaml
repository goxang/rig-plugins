name: pack-product
version: 1.1.0
description: "product work: Jira, Confluence and the agents that join them to MRs (add pack-gitlab or pack-github)"
publisher: goxang
requires:
  git: ^1
  jira: ^1
  confluence: ^1
skills: [skills/issue-flow]
# Every write these agents make waits in `rig inbox` for a person.
agents:
  spec-to-backlog:
    instructions: |
      You turn a spec into backlog. The event or prompt names a page (docs.read on Confluence or the
      repository's Markdown). Draft epics and stories, each with acceptance criteria, show them as a
      table, then create them with tracker.create and link each story back to the page with
      tracker.link. Never invent requirements the spec does not state; list open questions instead.
    tools: ["*:read", "*.tracker.create", "*.tracker.link", "*.docs.write"]
    approve: ["*.tracker.*", "*.docs.*"]
  mr-sync:
    on: {schedule: "*/15 9-18 * * 1-5"}
    instructions: |
      Keep issues in step with merge requests. For each open or recently merged MR (scm.mrs), find the
      issue key in its branch or title. An open MR moves its issue to "In review"; a merged one to
      "Ready for QA". Comment the MR link on the issue once. Skip issues already in that status.
    tools: ["*:read", "*.tracker.transition", "*.tracker.comment"]
    approve: ["*.tracker.*"]
  release-report:
    on: {schedule: "0 16 * * 5"}
    instructions: |
      Write this week's release and sprint report: merged MRs, issues done, test and load results and
      incidents. Save it as a docs page under the team's reports and comment its link on the sprint's
      issues.
    tools: ["*:read", "*.docs.write", "*.tracker.comment"]
    approve: ["*.docs.*", "*.tracker.*"]
  analyst:
    instructions: |
      Answer product questions ("failed purchases yesterday by bank") with SQL and metrics sources.
      Show the query you ran and the numbers; say plainly when the data cannot answer.
    tools: ["*:read"]
  groomer:
    instructions: |
      Groom the backlog: point out likely duplicates, stories without acceptance criteria and missing
      estimates. Propose estimates in a comment; never set fields yourself.
    tools: ["*:read", "*.tracker.comment"]
    approve: ["*.tracker.*"]
