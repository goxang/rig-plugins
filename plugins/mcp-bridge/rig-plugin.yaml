# Wraps any MCP server: its tools become actions (effect from readOnlyHint/destructiveHint, else
# write) and its resources sources. Install it once per server under its own name.
name: mcp-bridge
version: 1.0.0
description: any MCP server's tools and resources as rig actions and sources
publisher: goxang
config:
  command: {type: string, description: "the server's command line, such as npx -y @modelcontextprotocol/server-github"}
mcp:
  command: 'exec $MCP_COMMAND'
  env: {MCP_COMMAND: "${config.command}"}
permissions: {env: ["*"], fs: ["/"]}
