<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pong</title><link rel="stylesheet" href="common.css">
<style>
  .col { display: flex; flex-direction: column; gap: 12px; width: min(96vw, 860px); }
  canvas { width: 100%; aspect-ratio: 8 / 5; border-radius: 16px; background: #0a0e14; border: 1px solid var(--line); touch-action: none; cursor: none; }
  .scores { display: flex; justify-content: space-between; }
</style></head>
<body>
<header class="bar"><span class="brand">arcade</span><span class="room" id="room"></span>
  <button class="pill" id="who" title="Change name"></button><span class="pill bad" id="conn">connecting…</span></header>
<main><div class="col">
  <div id="seats"></div>
  <div class="status" id="status"></div>
  <canvas id="cv" width="800" height="500"></canvas>
  <button class="btn" id="again" hidden>Play again</button>
  <div class="muted" style="text-align:center">move the mouse, or W/S and arrow keys · first to 7</div>
</div></main>
<script src="common.js"></script>
<script>
const $ = (s) => document.querySelector(s), cv = $("#cv"), g = cv.getContext("2d");
let S = null;
$("#again").onclick = () => Arcade.send({ t: "rematch" });

let dir = 0;
const keyDir = { w: -1, s: 1, ArrowUp: -1, ArrowDown: 1 };
function setDir(d) { if (d !== dir) { dir = d; Arcade.send({ t: "dir", d }); } }
addEventListener("keydown", (e) => {
  if (e.key in keyDir) { e.preventDefault(); setDir(keyDir[e.key]); }
  if (e.key === "Enter" && !$("#again").hidden) Arcade.send({ t: "rematch" });
});
addEventListener("keyup", (e) => { if (keyDir[e.key] === dir) setDir(0); });
let lastPos = 0;
function pointer(e) {
  const r = cv.getBoundingClientRect(), now = performance.now();
  if (now - lastPos < 25) return;
  lastPos = now;
  Arcade.send({ t: "pos", y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)) });
}
cv.addEventListener("pointermove", pointer);
cv.addEventListener("pointerdown", pointer);

function draw() {
  requestAnimationFrame(draw);
  if (!S) return;
  const W = S.w, H = S.h;
  g.clearRect(0, 0, W, H);
  g.setLineDash([10, 14]); g.strokeStyle = "#28313d"; g.lineWidth = 3;
  g.beginPath(); g.moveTo(W / 2, 0); g.lineTo(W / 2, H); g.stroke(); g.setLineDash([]);
  g.font = "700 64px system-ui"; g.textAlign = "center"; g.fillStyle = "#28313d";
  g.fillText(S.score[0], W / 4, 80); g.fillText(S.score[1], 3 * W / 4, 80);
  S.pad.forEach((y, i) => {
    g.fillStyle = Arcade.seatColors[i];
    const x = i === 0 ? S.px : W - S.px - S.pw;
    g.beginPath(); g.roundRect(x, y - S.ph / 2, S.pw, S.ph, 6); g.fill();
  });
  if (S.phase === "play" || S.phase === "serve") {
    g.fillStyle = "#fff"; g.shadowColor = "#7c9cff"; g.shadowBlur = 16;
    g.beginPath(); g.arc(S.ball[0], S.ball[1], S.r, 0, 7); g.fill(); g.shadowBlur = 0;
  }
}
draw();

function render(s) {
  S = s;
  const seats = { ...s, turn: null, noturn: true, winner: null };
  Arcade.renderSeats($("#seats"), seats, ["◀", "▶"]);
  const me = Arcade.mySeat(s), over = s.phase === "over";
  const lead = s.score[0] > s.score[1] ? 0 : 1;
  let text = "";
  if (s.phase === "wait") text = "Waiting for an opponent…";
  else if (s.phase === "serve") text = s.serve_in > 0.4 ? "Get ready…" : "Go!";
  else if (over) text = me === lead ? "You win! 🎉" : me >= 0 ? "You lose" : `${s.seats[lead]} wins`;
  $("#status").textContent = text;
  $("#again").hidden = !(over && me >= 0);
}
Arcade.start({ msg: (m) => { if (m.t === "state") render(m); }, close: () => { dir = 0; } });
</script></body></html>
