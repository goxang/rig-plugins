name: arcade
version: 1.6.0
description: a Games tab with two parts, Offline (snake, sudoku, tic-tac-toe, 2048, tetris, pac-man in a terminal pane) and Online (host a room, share ip:port, play snake.io, draw & guess, tic-tac-toe, connect four, pong, the fox & floe river race, or team pac-man in the browser)
publisher: goxang
views:
  Games:
    slot: {tab: {key: G}}
    tabs:
      Offline: {widget: terminal, dir: ., command: "python3 hub.py offline"}
      Online: {widget: terminal, dir: ., command: "python3 hub.py online"}
