name: arcade
version: 1.3.0
description: a Games tab of terminal panes (snake and tic-tac-toe in Go; a game that is waiting uses no CPU)
publisher: goxang
views:
  Games:
    slot: {tab: {key: G}}
    tabs:
      Snake: {widget: terminal, command: "rig-std tool snake"}
      "Tic Tac Toe": {widget: terminal, command: "rig-std tool tictactoe"}
      Shell: {widget: terminal, keep: true}
