detect: {git_remote: gitlab}
config:
  url: {type: string, description: "web address; default from the origin remote"}
  project: {type: string, description: "owner/repo; default from the origin remote"}
  token: {type: string, secret: true}
permissions: {secrets: [GITLAB_TOKEN]}
# Merge requests in four views (open, mine, waiting for your review, a search over all states), each with
# the request as a page beside it; space marks several for a, m, R. i opens the issue the title or branch
# names (Jira, or "not found").
views:
  GitLab:
    slot: tab
    modes: [software, product]
    tabs:
      Open:
        widget: table
        source: gitlab.scm.mrs
        args: {query: ''}
        mark: id
        refresh: 30s
        columns: {url: {hide: true}}
        preview: {source: gitlab.scm.mr, args: {mr: '${row.id}'}, field: markdown, width: 50%}
        actions: &mr
          - {key: o, name: checkout target, action: git.vcs.checkout, args: {branch: '${row.target}'}}
          - {key: O, name: checkout source, action: git.vcs.checkout, args: {branch: '${row.source}'}}
          - {key: i, name: its issue, command: 'open Jira ${row.issue}'}
          - {key: a, name: approve, action: gitlab.scm.approve, args: {mr: '${row.id}'}}
          - {key: m, name: merge, action: gitlab.scm.merge, args: {mr: '${row.id}'}}
          - {key: R, name: rebase, action: gitlab.scm.rebase, args: {mr: '${row.id}'}}
          - {key: c, name: comment, action: gitlab.scm.comment, args: {mr: '${row.id}', body: '${ask}'}}
      Mine:
        widget: table
        source: gitlab.scm.mrs
        args: {author: me, query: ''}
        mark: id
        refresh: 30s
        columns: {url: {hide: true}}
        preview: {source: gitlab.scm.mr, args: {mr: '${row.id}'}, field: markdown, width: 50%}
        actions: *mr
      Review:
        widget: table
        source: gitlab.scm.mrs
        args: {author: review, query: ''}
        mark: id
        refresh: 30s
        columns: {url: {hide: true}}
        preview: {source: gitlab.scm.mr, args: {mr: '${row.id}'}, field: markdown, width: 50%}
        actions: *mr
      Search:
        widget: table
        source: gitlab.scm.mrs
        args: {state: all, query: ''}
        refresh: 60s
        columns: {url: {hide: true}}
        preview: {source: gitlab.scm.mr, args: {mr: '${row.id}'}, field: markdown, width: 50%}
        actions: *mr
      Pipelines:
        widget: table
        source: gitlab.scm.pipelines
        refresh: 15s
        columns: {url: {hide: true}}
        preview: {widget: table, source: gitlab.scm.jobs, args: {pipeline: '${row.id}'}, width: 45%}
      Releases:
        widget: table
        source: gitlab.scm.releases
        args: {query: ''}
        refresh: 60s
        actions:
          - {key: o, name: checkout, action: git.vcs.checkout, args: {branch: '${row.tag}'}}
      Issues: {widget: table, source: gitlab.tracker.issues, refresh: 60s}
