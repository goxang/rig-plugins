description: "unit/1: this project as an organisational unit: KPIs, people figures, items and requests, rolled up from the units below over rig serve"
config:
  unit: {type: string, description: "this unit's name, as the unit above calls it (default: the project's directory name)"}
  title: {type: string}
  layer: {type: integer, description: "1 for a team, 2 for the management above it, ..."}
  parent: {type: string}
  owner: {type: string}
  description: {type: string}
  kpis: {type: array, description: "delivery KPIs: {name, title, value | source+args+transform+since | from: children, reduce, field, ok, warn}"}
  people: {type: array, description: "people figures at unit level, same shape as kpis"}
  items: {type: array, description: "feeds of items from local sources: {kind, source, args, transform, map, severity}"}
  children: {type: object, description: "name: {url, token, env, fingerprint}: the units below, each a rig serve"}
  escalate: {type: string, description: "lowest severity of a child's item shown here (default high)"}
  cache: {type: string, description: "how long a child's answer is kept (default 1m)"}
  drill: {type: array, description: "roles of a remote caller that may read a child's own figures through this unit (child=); by default a unit above sees this unit's roll-up only"}
  expose: {type: array, description: "what the units above may read or run here: {name, title, description, source | action | from: child/name, args, inputs, widget, refresh, to: roles (default [parent])}"}
# KPIs come from any source of the project, so org reads through the host.
permissions: {uses: ["*"]}
# The protocol roles: a token for the unit above, HR, the product office and stakeholders reaches
# org.unit.* only, and each sees the exposures whose `to` lists its role. A unit's own policy wins.
policy:
  roles:
    parent:
      allow: ["org.unit.*:read", "org.unit.request:write", "org.unit.goal:write"]
      approve: ["org.unit.invoke:write"]
    hr:
      allow: ["org.unit.info:read", "org.unit.people:read", "org.unit.requests:read", "org.unit.exposed:read", "org.unit.show:read", "org.unit.request:write"]
    product:
      allow: ["org.unit.info:read", "org.unit.kpis:read", "org.unit.exposed:read", "org.unit.show:read", "org.unit.request:write"]
      approve: ["org.unit.invoke:write"]
    stakeholder:
      allow: ["org.unit.info:read", "org.unit.exposed:read", "org.unit.show:read", "org.unit.invoke:write"]
